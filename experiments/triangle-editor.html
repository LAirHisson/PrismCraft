<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Éditeur — pixels triangulaires</title>
  <style>
    @font-face {
      font-family: 'Monocraft';
      src: url('/assets/fonts/Monocraft-Light.ttf') format('truetype');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #444; color: #eee; font-family: 'Monocraft', monospace;
      padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    h1 { font-size: 20px; }
    .panel {
      background: #C6C6C6; color: #222; padding: 20px; border: 4px solid #555;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .row { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
    .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .col span { font-size: 13px; }
    canvas { background: #fff; border: 3px solid #555; image-rendering: pixelated; cursor: crosshair; }
    /* Résolution interne > taille affichée (supersampling) — un lissage doux à l'affichage
       donne des arêtes de triangle plus nettes ; pixelated casserait cet effet ici. */
    #c-triangle { image-rendering: auto; }
    #toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    #palette-row { display: flex; align-items: center; gap: 12px; }
    #palette-grid { display: grid; grid-template-columns: repeat(8, 28px); gap: 4px; }
    #active-color {
      width: 36px; height: 36px; border: 3px solid #000;
      outline: 2px solid #a0a0a0; flex: none;
    }
    #color-picker { width: 40px; height: 40px; border: none; padding: 0; cursor: pointer; }
    input[type="file"] { display: none; }
    p.hint { font-size: 12px; color: #555; text-align: center; max-width: 700px; }
  </style>
</head>
<body>
  <h1>Le paint du triangle</h1>

  <div class="panel">
    <div id="toolbar"></div>
    <div id="palette-row">
      <div id="active-color"></div>
      <div id="palette-grid"></div>
      <input type="color" id="color-picker" value="#000000" title="Modifier la couleur sélectionnée" />
    </div>
    <!-- <p class="hint">
      Clic gauche (+ glisser) pour peindre, clic droit pour piocher une couleur (pipette).
      Peindre sur l'une ou l'autre vue met les deux à jour — même donnée sous-jacente.
    </p> -->
  </div>

  <div class="row">
    <div class="col">
      <span>Vue carrée</span>
      <canvas id="c-square"></canvas>
    </div>
    <div class="col">
      <span>Vue triangulaire</span>
      <canvas id="c-triangle"></canvas>
    </div>
  </div>

  <input type="file" id="file-texture" accept="image/*" />
  <input type="file" id="file-palette" accept="image/*" />

  <script type="module" src="triangle-editor.js"></script>
</body>
</html>
