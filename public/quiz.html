<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz cubique</title>
  <style>
    @font-face {
      font-family: 'Minecraftia';
      src: url('assets/fonts/Minecraftia-lieght.ttf') format('truetype');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Minecraftia', monospace;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      image-rendering: pixelated;
      background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
        url('assets/textures/blocks/dirt.png') repeat;
      background-size: cover, 64px 64px;
    }
    .panel {
      width: min(92vw, 560px);
      background:
        linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
        url('assets/textures/blocks/stone.png') repeat;
      background-size: cover, 96px 96px;
      border: 6px solid #1c1c1c;
      outline: 4px solid #6b6b6b;
      padding: 24px 24px 28px;
      text-align: center;
    }
    .logo {
      width: 56px; height: 56px;
      margin: 0 auto 12px;
      background: url('assets/textures/blocks/grass_side.png') center / cover;
      border: 3px solid #000;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 12px;
      text-shadow: 2px 2px 0 #3a3a3a;
      letter-spacing: 1px;
    }
    .hearts {
      display: flex;
      justify-content: center;
      gap: 2px;
      margin-bottom: 18px;
    }
    .heart {
      width: 22px; height: 22px;
      background-size: cover;
      background-repeat: no-repeat;
      filter: drop-shadow(0 1px 1px #000);
    }
    .question {
      font-size: 16px;
      line-height: 1.5;
      min-height: 48px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 0 #000;
    }
    .answers { display: grid; gap: 12px; }
    .answer {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 16px;
      color: #fff;
      text-align: left;
      text-shadow: 2px 2px 0 #000;
      cursor: pointer;
      background: #6b6b6b;
      border-top: 3px solid #a0a0a0;
      border-left: 3px solid #a0a0a0;
      border-right: 3px solid #2a2a2a;
      border-bottom: 3px solid #2a2a2a;
      transition: filter 0.1s;
    }
    .answer:hover { filter: brightness(1.2); }
    .answer.wrong {
      background: #b02020;
      border-top-color: #e05555;
      border-left-color: #e05555;
      border-right-color: #601010;
      border-bottom-color: #601010;
      cursor: default;
      pointer-events: none;
      filter: none;
      opacity: 0.85;
    }
    .answer .key {
      width: 30px; height: 30px; flex: none;
      display: flex; align-items: center; justify-content: center;
      background: url('assets/textures/gui/hotbar/slot_background.png') center / cover;
      border: 2px solid #000;
      font-size: 14px;
    }
    .footer { margin-top: 18px; font-size: 11px; color: #d8d8d8; min-height: 14px; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="logo"></div>
    <h1>QUIZ CUBIQUE</h1>
    <div class="hearts" id="hearts"></div>
    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
    <div class="footer" id="footer"></div>
  </div>

  <script>
    const FULL = "url('assets/textures/gui/hotbar/full.png')";
    const EMPTY = "url('assets/textures/gui/hotbar/container.png')";
    const KEYS = ["A", "B", "C", "D"];

    const QUESTIONS = [
      {
        q: "Combien y a-t-il de types de villages différents ?",
        a: ["3 types", "5 types", "7 types", "9 types"],
        correct: 1,
      },
      {
        q: "Que sont les blocs ?",
        a: ["Des cubes", "Des sphères", "Des triangles", "Des pavés droits"],
        correct: 2,
      },
    ];

    const MAX_HEARTS = 10;
    let qi = 0;
    let hearts = MAX_HEARTS;

    const heartsEl = document.getElementById("hearts");
    const questionEl = document.getElementById("question");
    const answersEl = document.getElementById("answers");
    const footerEl = document.getElementById("footer");

    function renderHearts() {
      heartsEl.textContent = "";
      for (let i = 0; i < MAX_HEARTS; i++) {
        const h = document.createElement("div");
        h.className = "heart";
        h.style.backgroundImage = i < hearts ? FULL : EMPTY;
        heartsEl.appendChild(h);
      }
    }

    function renderQuestion() {
      const { q, a } = QUESTIONS[qi];
      questionEl.textContent = q;
      footerEl.textContent = "Réponds pour continuer…";
      answersEl.textContent = "";
      a.forEach((text, i) => {
        const btn = document.createElement("button");
        btn.className = "answer";
        btn.innerHTML =
          '<span class="key">' + KEYS[i] + "</span><span>" + text + "</span>";
        btn.addEventListener("click", () => onAnswer(i, btn));
        answersEl.appendChild(btn);
      });
    }

    function goToGame() {
      const skin = new URLSearchParams(location.search).get("skin");
      location.href = "index.html" + (skin ? "?skin=" + encodeURIComponent(skin) : "");
    }

    function onAnswer(i, btn) {
      if (i === QUESTIONS[qi].correct) {
        qi++;
        if (qi >= QUESTIONS.length) goToGame();
        else renderQuestion();
        return;
      }
      btn.classList.add("wrong");
      if (hearts > 0) hearts--;
      renderHearts();
      footerEl.textContent = "Mauvaise réponse ! Réessaie…";
    }

    renderHearts();
    renderQuestion();
  </script>
</body>
</html>
